[package]
name = "odc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Safe Rust wrapper for ECMWF's odc (ODB-2 encoder/decoder) library"

[features]
default = ["vendored"]

# Build strategy (mutually exclusive)
vendored = ["odc-sys/vendored", "eckit/vendored"]
system = ["odc-sys/system", "eckit/system"]

[dependencies]
odc-sys.workspace = true
eckit.workspace = true
parking_lot.workspace = true
polars.workspace = true
thiserror.workspace = true

[package.metadata.docs.rs]
