[workspace]
resolver = "2"
members = ["crates/odc", "crates/odc-sys"]

[workspace.package]
version = "1.6.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ecmwf/odc"
rust-version = "1.90"
readme = "README.md"
keywords = ["ecmwf", "weather", "meteorology", "odb"]
categories = ["science"]

[workspace.dependencies]
# Internal
odc = { version = "1.6", path = "crates/odc", default-features = false }
odc-sys = { version = "1.6", path = "crates/odc-sys", default-features = false }

# Foundation crates
eckit = { version = "2.5", default-features = false }
eckit-sys = { version = "2.5", default-features = false }

# Build tools
bindman = "0.2"
bindman-build = "0.2"
bindman-utils = "0.2"

# External
cxx = "1.0"
cxx-build = "1.0"
parking_lot = "0.12"
polars = { version = "0.54", default-features = false, features = ["fmt"] }
polars-arrow = { version = "0.54", default-features = false }
tempfile = "3"
thiserror = "2"
