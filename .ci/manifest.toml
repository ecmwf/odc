[package]
name = "odc"
repo = "ecmwf/odc"
visibility = "public"
compiler-inputs = ["cxx-compiler"]
allow-stale-deps = true

[[deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

# odc with its Fortran interface, named by the Fortran compiler too, since
# Fortran modules only work with the compiler that wrote them. Plain odc is
# built without Fortran.
[packages.odc-fortran]
compiler-inputs = ["cxx-compiler", "fortran-compiler"]
allow-stale-deps = true

[[packages.odc-fortran.deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

[matrix.build]
packages = ["odc"]
triggers = ["upstream-change", "rebuild-request"]

[matrix.build.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-large"

[[matrix.build.include]]
cxx-compiler = "clang++-18"
c-compiler = "clang-18"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-clang18"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-15"
c-compiler = "gcc-15"
container = "eccr.ecmwf.int/public-ci-images/ubuntu26.04-gcc15-gfortran15"
platform = "ubuntu-26.04"

[[matrix.build.include]]
cxx-compiler = "g++-8"
c-compiler = "gcc-8"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gcc8-gfortran8"
platform = "rocky-8"

[[matrix.build.include]]
cxx-compiler = "g++-11"
c-compiler = "gcc-11"
container = "eccr.ecmwf.int/public-ci-images/rocky9-gcc11-gfortran11"
platform = "rocky-9"

[[matrix.build.include]]
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
container = "eccr.ecmwf.int/public-ci-images/rocky10-gcc14-gfortran14"
platform = "rocky-10"

[[matrix.build.include]]
cxx-compiler = "g++-10"
c-compiler = "gcc-10"
container = "eccr.ecmwf.int/public-ci-images/debian11-gcc10-gfortran10"
platform = "debian-11"

[[matrix.build.include]]
cxx-compiler = "g++-12"
c-compiler = "gcc-12"
container = "eccr.ecmwf.int/public-ci-images/debian12-gcc12-gfortran12"
platform = "debian-12"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
container = "eccr.ecmwf.int/public-ci-images/debian13-gcc14-gfortran14"
platform = "debian-13"

[matrix.fortran]
packages = ["odc-fortran"]
triggers = ["upstream-change", "rebuild-request"]

[matrix.fortran.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-normal"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
fortran-compiler = "gfortran-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13"
platform = "ubuntu-24.04"

[[matrix.fortran.include]]

[matrix.build-hpc]
packages = ["odc"]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

[matrix.build-hpc.defaults]
job-script = "./.ci/build.sh.j2"
cxx-compiler = "g++-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
time = "00:40:00"

[[matrix.build-hpc.include]]

[[matrix.build-hpc.include]]
cxx-compiler = "g++-15"
platform = "hpc-atos-gnu"
modules = ["load prgenv/gnu", "unload gcc", "load gcc/15.2.0", "load cmake", "load ninja"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"

[packages.odc-rust]
compiler-inputs = ["cxx-compiler"]
allow-stale-deps = true

[[packages.odc-rust.deps]]
package = "odc"

[[packages.odc-rust.deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
crates = ["eckit", "eckit-sys"]

[matrix.rust]
packages = ["odc-rust"]
publishes = false

[matrix.rust.defaults]
job-script = "./.ci/rust.sh.j2"
runs-on = "arc-runner-normal"
build-type = "RelWithDebInfo"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-boost-qt6-rust1.90"
platform = "ubuntu-24.04"

[[matrix.rust.include]]
rust-compiler = "rust-1.90"
