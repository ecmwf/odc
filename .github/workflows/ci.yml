name: ci

on:
  # Trigger the workflow on push to master or develop, except tag creation
  push:
    branches:
      - 'master'
      - 'develop'
    tags-ignore:
      - '**'

  # Trigger the workflow on pull request
  pull_request: ~

  # Trigger the workflow manually
  workflow_dispatch: ~

  # Trigger after public PR approved for CI
  pull_request_target:
    types: [labeled]

jobs:
  # Run Rust CI (fmt + clippy + test) on the rust/ workspace
  ci-rust:
    name: ci-rust
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/reusable-workflows/.github/workflows/ci-rust.yml@main
    with:
      manifest-path: rust/Cargo.toml
      features: --features vendored
    secrets:
      private_repos_token: ${{ secrets.GH_REPO_READ_TOKEN }}

  # Run CI including downstream packages on self-hosted runners
  downstream-ci:
    name: downstream-ci
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci.yml@main
    with:
      odc: ecmwf/odc@${{ github.event.pull_request.head.sha || github.sha }}
      codecov_upload: true
      clang_format: true
    secrets: inherit

  # Build downstream packages on HPC
  downstream-ci-hpc:
    name: downstream-ci-hpc
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci-hpc.yml@main
    with:
      odc: ecmwf/odc@${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
